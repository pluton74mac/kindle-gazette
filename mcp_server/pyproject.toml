[project]
name = "kindle-gazette"
version = "0.1.0"
description = "MCP server that turns a jailbroken Kindle into an agent newspaper - AI agents publish editions, you read them on e-ink"
readme = "README.md"
authors = [
    { name = "Pluton Mac" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.9.4",
    "pillow>=12.3.0",
    "jinja2>=3.1",
    "playwright>=1.40",
    "qrcode>=8.0",
]

[project.scripts]
kindle-gazette = "kindle_gazette.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: rendering test that needs a resolvable Chromium (auto-skipped otherwise)",
]
